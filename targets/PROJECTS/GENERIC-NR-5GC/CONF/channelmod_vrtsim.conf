#/* vrtsim channel model (chanmod) configuration */
#
# Selected automatically when "--vrtsim.chanmod 1" is on the command line (the config loader inlines this
# file and skips the rfsim channelmod include). vrtsim looks up models by these FIXED names:
#   - "server_tx_channel_model"  (server role: gNB Uu, or PC5 server)
#   - "client_tx_channel_model"  (client role: UE Uu, or PC5 client)
# Define BOTH (identical here) so the role mapping never matters.
#
# Editable per trial:
#   type           : "AWGN" (single tap + noise). Other models: "TDL_A".."TDL_E", "Rayleigh1", etc.
#   ploss_dB       : path loss in dB (0 = none)
#   noise_power_dB : AWGN noise power. 100 = DISABLED (default). Negative ADDS noise: toward 0 = more noise, more-negative = less (-50 light); ~-30 and above breaks sync.
#   ds_tdl         : delay spread in ns (only for TDL models; 0 for AWGN)

channelmod = {
  max_chan = 10;
  modellist = "modellist_vrtsim";
  modellist_vrtsim = (
    {
      model_name     = "server_tx_channel_model";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = 100;   # 100 = disabled (no added noise). Set negative to ADD noise (toward 0 = more); -50 light, ~-30 already breaks sync. Tune live via telnet or --vrtsim.noise_power_dBFS.
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    },
    {
      model_name     = "client_tx_channel_model";
      type           = "AWGN";
      ploss_dB       = 0;
      noise_power_dB = 100;   # 100 = disabled (no added noise). Set negative to ADD noise (toward 0 = more); -50 light, ~-30 already breaks sync. Tune live via telnet or --vrtsim.noise_power_dBFS.
      forgetfact     = 0;
      offset         = 0;
      ds_tdl         = 0;
    }
  );
};
