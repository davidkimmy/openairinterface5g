#/* configuration for channel modelisation */
#/* To be included in main config file when */
#/* channel modelisation is used (rfsimulator with chanmod options enabled) */
channelmod = {
  max_chan=10;
  modellist="modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
        model_name                       = "rfsimu_channel_ue0"
        type                             = "AWGN";
        ploss_dB                         = 10;
        noise_power_dB                   = -10;
        forgetfact                       = 0;
        offset                           = 0;
        ds_tdl                           = 0;
    },
    {
        model_name                       = "rfsimu_channel_enB0"
        type                             = "AWGN";
        ploss_dB                         = 10;
        noise_power_dB                   = -10;
        forgetfact                       = 0;
        offset                           = 0;
        ds_tdl                           = 0;
    },
    # Dedicated PC5 model for the relay's sidelink card (ru_id 1). Without this entry the PC5 card
    # looks up "rfsimu_channel_enB1", fails, and falls back to the Uu model "rfsimu_channel_enB0"
    # (simulator.cpp addModule), so any PC5 noise/ploss override on enB0 also hits the relay's Uu
    # downlink and drops its CSI-RS SINR (-> CQI 0 -> gNB "invalid cqi_idx 0"). Keep PC5 impairment
    # on this enB1 entry (index [2]) and leave enB0 (index [1], relay Uu) clean.
    {
        model_name                       = "rfsimu_channel_enB1"
        type                             = "AWGN";
        ploss_dB                         = 10;
        noise_power_dB                   = -10;
        forgetfact                       = 0;
        offset                           = 0;
        ds_tdl                           = 0;
    }
  );
};

