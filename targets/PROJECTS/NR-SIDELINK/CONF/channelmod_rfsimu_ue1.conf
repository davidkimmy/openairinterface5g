#/* configuration for channel modelisation */
#/* To be included in main config file when */
#/* channel modelisation is used (rfsimulator with chanmod options enabled) */
channelmod = {
  max_chan=10;
  modellist="modellist_rfsimu_1";
  modellist_rfsimu_1 = (
    {
        model_name                       = "rfsimu_channel_ue0"
        type                             = "AWGN";
        ploss_dB                         = 10;
        noise_power_dB                   = -10;
        forgetfact                       = 0;
        offset                           = 0;
        ds_tdl                           = 0;
    },
    {
        model_name                       = "rfsimu_channel_enB0"
        type                             = "AWGN";
        ploss_dB                         = 10;
        noise_power_dB                   = -10;
        forgetfact                       = 0;
        offset                           = 0;
        ds_tdl                           = 0;
    },
    # Kept index-aligned with channelmod_rfsimu_sync_ref.conf so the same --channelmod.modellist_rfsimu_1.[N]
    # flags are valid on both nodes. The nearby UE has a single (PC5-server) card that RXes on
    # "rfsimu_channel_ue0" (index [0]); this enB1 entry is unused here but must exist for index [2] to resolve.
    {
        model_name                       = "rfsimu_channel_enB1"
        type                             = "AWGN";
        ploss_dB                         = 10;
        noise_power_dB                   = -10;
        forgetfact                       = 0;
        offset                           = 0;
        ds_tdl                           = 0;
    }
  );
};

